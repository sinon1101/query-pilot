spring:
  application:
    name: data-agent

  # 应用自身的库（对话历史、执行轨迹，第二阶段启用 JPA 实体）
  datasource:
    url: jdbc:mysql://localhost:3307/dataagent?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: dataagent
    password: dataagent123
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

  ai:
    openai:
      # 阿里云百炼「OpenAI 兼容端点」。Spring AI 会自动补 /v1/chat/completions、/v1/embeddings
      base-url: https://dashscope.aliyuncs.com/compatible-mode
      # 只从环境变量读取，绝不写死进仓库；优先标准名 DASHSCOPE_API_KEY，回退到本机已有的 API-KEY
      api-key: ${DASHSCOPE_API_KEY:${API-KEY:}}
      chat:
        options:
          # qwen3.6-flash：轻量多模态模型，替换额度耗尽的 qwen3.7-plus。
          # 兼容端点同样支持 tool call 和图片输入。
          model: qwen3.6-flash
          temperature: 0.3
      embedding:
        options:
          model: text-embedding-v4   # 兼容端点同样提供 text-embedding-v4（1024 维），向量化沿用

# Agent 自定义配置
agent:
  max-rounds: 10          # ReAct 循环最大轮数，防止死循环烧 token
  sql:
    max-retries: 3        # SQL 报错自愈的最大重试次数
    timeout-seconds: 10   # 单条查询超时
    max-rows: 200         # 返回给模型的最大行数，防止撑爆上下文
  # 业务库只读数据源：独立账号，数据库层面只有 biz 库的 SELECT 权限
  biz-datasource:
    url: jdbc:mysql://localhost:3307/biz?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: agent_ro
    password: agent_ro123
  # schema/业务术语向量检索（Redis Stack @6380，端口错开本机另一项目）
  rag:
    redis-host: localhost
    redis-port: 6380
    top-k: 8              # schema_search 融合后返回的文档数（表/列/取值/口径混合，故比第一版大）
    dense-k: 20           # 稠密/词法各自的候选池大小，RRF 融合前每路取 top-N
  memory:
    window-size: 20       # 注入模型的历史消息条数上限（10 轮对话），防止上下文无限膨胀
  reflect:
    enabled: true         # 收敛前 Critic 语义审校，抓 SQL 能跑通但口径错的静默错误
    max-reflections: 1    # 单次对话最多打回重做次数（1 次已能覆盖多数语义错，再多性价比低）
  # 自适应复杂度路由：进循环前按问题分档，按档位调 maxRounds / 是否反思 / 是否走工具
  router:
    enabled: true             # 关掉即退化回原行为（一律 COMPLEX 档 + 全局 reflect），用于 A/B 对照
    simple-max-rounds: 7      # 简单/模糊维度题：不触发反思（避开 phase-5 过度纠偏坑）是主收益；
                              # 轮数留 7（仍紧于 COMPLEX 10）——一个会出图的简单题需 检索+SQL(可能重试)+出图+收敛≈6 轮，砍太狠会腰斩合法路径
    complex-max-rounds: 10    # 口径敏感题（销售额/GMV/动销/退款率/核销/妥投…）：留足自愈+反思空间

logging:
  level:
    com.yang.dataagent: DEBUG
